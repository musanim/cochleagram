// away exactly as dragging the window narrower does, which is not marked
// either.
$('waveform').onchange = e => {
    S.showWaveform = e.target.checked; save();
    display.setReadouts({ waveform: S.showWaveform });
};
$('spectrum').onchange = e => {
    S.showSpectrum = e.target.checked; save();
    display.setReadouts({ spectrum: S.showSpectrum });
    // The column count has moved, and half the picture is the close-up strip's
    // ceiling -- so the current strip may now be illegal. The ResizeObserver
    // does this after a window resize; nothing observes a change of share.
    refit();
};
display.onSpectrumShareChanged = share => {
    S.spectrumShare = share;
    refit();
    save();
};
$('auto').onchange = e => {
    if (!e.target.checked) {
        // Hand back the control where the controller left it, not where the
        // visitor last put it: switching to manual is what you do when Auto
        // gain is close but not right, and it would be no use at all if the
        // picture jumped at the moment you took over.
        //
        // Folding the reference into sensitivity makes the correct reference
        // zero, which is why it is cleared rather than kept.
        //
        // The picture does jump if the sum lands outside the control's own
        // limits, which needs a source quiet or loud enough to have driven the
        // reference more than 200 dB from where sensitivity was left.
        S.sensDB = clampSens(S.sensDB - display.autoRef);
        display.autoRef = 0;
        $('sens').value = String(S.sensDB);
        Object.assign(display.exposure, windowFor(S.sensDB, S.rangeDB));
    }
    S.autoGain = e.target.checked; save();
    $('sens').disabled = S.autoGain;
    display.exposure.autoGain = S.autoGain;
    display.remapAll();
};

/// No guard, no minimum separation, no interaction between the two: a
/// midpoint and a width are independent, and the window is free to hang off
/// either end of the scale because levels outside it simply clamp.
function exposureChanged() {
    // Only when Auto gain is off. While it is on, the frame loop has been
    // writing the *readout* -- sensitivity less the reference -- into this
    // control, so reading it back would subtract the reference a second time
    // and then not zero it. One nudge of `range` moved the picture by that
    // many decibels and left a wrong value saved; during a drag it walked,
    // every frame writing a new readout and every input event reading it in.
    if (!S.autoGain) S.sensDB = clampSens(+$('sens').value);
    S.rangeDB = clampRange(+$('rng').value);
    save();
    Object.assign(display.exposure, windowFor(S.sensDB, S.rangeDB));
    display.remapAll();
}
$('sens').oninput = exposureChanged;
$('rng').oninput  = exposureChanged;

// ---- the frame -----------------------------------------------------------

/// The display controls back to their starting values -- not Speed, not ERB,
/// and not what is on screen. See `displayDefaults`.
$('reset').onclick = () => {
    const hadDeskew = S.deskew;
    S = { ...S, ...displayDefaults };
    // The reference goes too, and this is the point of the whole button.
    // Sensitivity is only reproducible if it means the same thing in both
    // apps, and while Auto gain is on it means "95 plus wherever the
    // controller has drifted" -- a number that depends on everything heard
    // since the page loaded. Restoring 95 and leaving the drift in place would
    // put the two apps back where they were: agreeing on the control and
    // disagreeing about the picture.
    display.autoRef = 0;
    // Applied to any sound already running, so the button's effect is audible
    // rather than only stored.
    if (replayGainNode) {
        replayGainNode.gain.value = replayGainLinear(S.replayGainDb);
    }
    save();
    // The sensitivity control is written only when the number it shows would
    // change, so the remembered value has to be forgotten or the slider can be
    // left reading one thing with another in force: while Auto gain is on the
    // control reports sensitivity plus the reference, and that sum can be
    // unchanged across a press that moved both.
    shownSens = null;
    applySettings();
    applyCloseUp();
    display.remapAll();
    // De-skew is the engine's business, and it is the only thing here that
    // is. The tuning and the column rate are no longer touched, so the engine
    // does not have to be reopened and whatever is on screen survives the
    // press -- which is the point of leaving them alone.
    if (worker && S.deskew !== hadDeskew) {
        // The same seam the checkbox draws, for the same reason: the columns
        // either side of the change were never adjacent.
        display.mark('seam');
        worker.postMessage({ type: 'deskew', value: S.deskew ? 1 : 0 });
    }
};

/// Last value written to the sensitivity control, so the DOM is touched only
/// when the number it shows would change rather than sixty times a second.
let shownSens = null;

// ---- RePlay ---------------------------------------------------------------
//
// Hearing what is on screen. Only ever offered on a frozen picture from live
// input: a file is already audible and already on disk, so a second way to play
// it would be two controls doing one job -- and that also disposes of every
// question about how the two transports interact, because they never coexist.

/// Whether the audio arriving now belongs to the picture.
///
/// The live source is asserted, not deduced from the absence of a file. There
/// are windows where `playingFile` is already false and nothing has replaced it
/// -- between a file's `onended` and `finishFile`, and across the awaits in
/// `playFile` and `startMic` -- and in those, silence delivered by a
/// disconnected node would go into the recording and put Play Selection on a
/// frozen end-of-file picture, offering a few tens of milliseconds of nothing.
/// The Mac cannot reach that state because there it is a flag, set only where a
/// live input actually starts.
function capturing() { return !!micSource && !playingFile && !paused; }

// A declaration, not `const isReplaying = () => ...`. `showTransport()` runs at
// the top of the module, before this point, and reaches `showReplayControls`
// and `stopReplay` -- both hoisted -- which ask this. As a `const` it would
// still be in its temporal dead zone, and the ReferenceError would abort the
// rest of the module: no handlers, no audio, a dead page with one warning in
// the status line.
function isReplaying() { return replaySource !== null; }

/// How far behind the sound the picture is, in milliseconds.
///
/// With De-skew **on** every tap is held back to the slowest, so a column
/// stands for one instant, uniformly the apex's travel time in the past -- 186
/// ms at ERB 0.6. That is the largest single offset anywhere in the app, and
/// ignoring it would play a fifth of a second later than the lines said.
///
/// With it **off** there is no one answer: the column holds each tap's own
/// response to an event `gdelay[k]` ago, a smear from the base's delay to the
/// apex's, which is exactly the slant De-skew exists to remove. The base's is
/// the number used, because the top of the slant is the leading edge -- the
/// first ink an event makes, and what the eye reads a click's position from.
///
/// `delays` comes from the engine on 'ready', in seconds.
function displayLagMs() {
    if (!engineDelays || !engineDelays.length) return 0;
    let lo = Infinity, hi = -Infinity;
    for (const d of engineDelays) { if (d < lo) lo = d; if (d > hi) hi = d; }
    return (S.deskew ? hi : lo) * 1000;
}

/// Keep the recorder's arithmetic in step with the picture's.
function syncRecorder() {
    if (!ctx) return;
    // A change of input device keeps the picture, so the epoch alone would not
    // notice it, and everything already recorded is at the old rate. The rate
    // is part of what makes a recording the same recording.
    if (display.contentEpoch !== recordedEpoch || ctx.sampleRate !== recorder.rate) {
        stopReplay();
        recorder.reset(ctx.sampleRate);
        recordedEpoch = display.contentEpoch;
        recordedPerColumn = 0;
        recordedLag = -1;
        showReplayControls();
    }
    const perColumn = ctx.sampleRate * (S.columnMs / closeUpK) / 1000;
    const lag = Math.round(displayLagMs() / 1000 * ctx.sampleRate);
    if (perColumn > 0 && (perColumn !== recordedPerColumn || lag !== recordedLag)) {
        recorder.beginSegment(display.nextEngineColumn, perColumn, lag);
        recordedPerColumn = perColumn;
        recordedLag = lag;
    }
}

/// On screen only while a live picture is frozen. Hidden rather than disabled:
/// a disabled control is an invitation with a reason to find, and this one
/// applies to a state the user is either in or not.
function showReplayControls() {
    const show = !playingFile && paused && !recorder.isEmpty;
    if (!show) stopReplay();
    for (const id of ['playsel', 'vol', 'selrule']) $(id).hidden = !show;
    $('playsel').textContent = isReplaying() ? 'Stop' : 'Play Selection';
}

function startReplay() {
    const sel = display.selectionColumns;
    if (!sel || !ctx) return;
    // `sel.end` is one past the last column, extended by that column's own
    // span, so a one-column selection is a column's worth of sound rather than
    // none.
    const frames = recorder.slice(sel.lo, sel.end);
    if (!frames || !frames.length) {
        say('that part of the picture is no longer in the recording');
        return;
    }
    stopReplay();
    const buf = ctx.createBuffer(1, frames.length, ctx.sampleRate);
    buf.copyToChannel(frames, 0);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const gain = ctx.createGain();
    gain.gain.value = replayGainLinear(S.replayGainDb);
    src.connect(gain).connect(ctx.destination);
    src.start();

    replaySource = src;
    replayGainNode = gain;
    replayFrom = sel.lo;
    replayTo = sel.end - 1;
    // Clamped the same way `slice` clamps it, so the line and the sound agree
    // about where the playback began. With De-skew on the start of a selection
    // can point a fifth of a second before anything recorded -- the picture is
    // held back by that much -- and the sound then starts at the oldest sample
    // there is.
    const a = recorder.sampleForColumn(sel.lo);
    replayFromSample = Math.max(a === null ? recorder.oldestSample : a,
                                recorder.oldestSample);
    replayStarted = ctx.currentTime;
    replayStartedMs = performance.now();
    replaySeconds = frames.length / ctx.sampleRate;
    display.playhead = sel.lo;
    showReplayControls();
    say(`playing ${Math.round(replaySeconds * 1000)} mS of the picture`);
}

/// Stop, not pause. Nothing remembers where the sound had got to, so the next
/// press starts at the beginning of the selection again -- which is what the
/// button says it will do.
function stopReplay() {
    if (!isReplaying() && display.playhead === null) return;
    if (replaySource) {
        // Silenced before it is stopped. `stop()` takes effect at the next
        // quantum either way, and resuming turns the recording back on within
        // microseconds of this call: the tail must not be recorded as though it
        // were the room.
        try { replayGainNode.gain.value = 0; } catch {}
        try { replaySource.onended = null; replaySource.stop(); } catch {}
        try { replaySource.disconnect(); replayGainNode.disconnect(); } catch {}
    }
    replaySource = null;
    replayGainNode = null;
    replaySeconds = 0;
    display.playhead = null;
    showReplayControls();
}

/// The bottom of the travel is silence, not the quietest audible setting: a
/// volume control that cannot reach zero is not a volume control.
function replayGainLinear(db) {
    if (db <= REPLAY_GAIN_RANGE[0] + 0.001) return 0;
    return Math.pow(10, db / 20);
}

/// Move the line, and notice the end of the sound.
///
/// The clock rather than the node: `onended` would do, but it is one more thing
/// that can arrive on behalf of a playback already replaced, and the frame is
/// running anyway to move the line.
function replayTick() {
    if (!isReplaying()) {
        if (display.playhead !== null) stopReplay();
        return;
    }
    // Wall time first, and it is not a belt-and-braces duplicate of the line
    // below. `ctx.currentTime` does not advance while the context is suspended,
    // and RePlay lives on a frozen picture -- where `onstatechange`
    // deliberately does *not* auto-resume, because that is how pausing a file
    // is implemented. Background the tab mid-playback and the audio clock
    // stops: nothing would ever end the playback, and a stationary violet line
    // on a frozen picture is exactly what the design says must never happen.
    // The Mac's `hasReplayFinished` uses `CACurrentMediaTime` for this reason.
    if ((performance.now() - replayStartedMs) / 1000 > replaySeconds + 0.25) {
        stopReplay();
        return;
    }
    // The render clock for the position itself, which is what the Mac's
    // `playerTime` is.
    const elapsed = ctx.currentTime - replayStarted;
    // Running out is one of the ways playback ends, and it ends the same way
    // the button does.
    if (elapsed >= replaySeconds) { stopReplay(); return; }
    // The selection has to still be on the picture. Narrowing the window
    // right-aligns what is drawn, so the left of a selection can scroll off
    // while it is being played, and a line cannot follow columns that are no
    // longer there.
    const drawn = display.drawnColumns;
    if (drawn && drawn.lo > replayFrom) { stopReplay(); return; }
    const at = replayFromSample + Math.round(elapsed * ctx.sampleRate);
    const g = recorder.columnForSample(at, replayFrom);
    if (g === null) return;
    // Never outside what was selected, however the arithmetic rounds.
    display.playhead = Math.min(Math.max(g, replayFrom), replayTo);
}

$('playsel').onclick = () => { isReplaying() ? stopReplay() : startReplay(); };
$('vol').oninput = e => {
    S.replayGainDb = Math.round(Number(e.target.value));
    // Live, unlike every other control's effect on a playback in progress. The
    // others change how the picture is drawn; this one is the sound itself, and
    // a volume that only took effect next time could not be set by ear.
    if (replayGainNode) {
        replayGainNode.gain.value = replayGainLinear(S.replayGainDb);
    }
    save();
};
// A click on the picture, or a grab of the close-up boundary, chooses what to
// play -- so neither can be ignored while something is playing.
display.onSelectionDisturbed = stopReplay;

function frame(t) {
    syncRecorder();
    // What has scrolled off the left of the picture is audio nobody can select
    // any more, and this is the whole of the memory policy.
    const drawn = display.drawnColumns;
    if (drawn) recorder.trim(drawn.lo);
    replayTick();
    display.render();
    if (S.autoGain) {
        const shown = clampSens(S.sensDB - display.autoRef);
        if (shown !== shownSens) $('sens').value = String(shownSens = shown);
    } else {
        shownSens = null;
    }
    // Ten times a second, on its own clock rather than folded into the status
    // line's. A backlog of a tenth of a second is already worth acting on, so
    // the interval between the fault being true and the button saying so should
    // be small against the fault itself -- a second's granularity would have
    // made the report ten times later than the thing it was reporting.
    if (t - lastCatchUpCheck > CATCHUP_CHECK_MS) {
        lastCatchUpCheck = t;
        updateCatchUp();
    }
    if (t - lastReport > 1000) {
        const rate = colsSeen * 1000 / (t - lastReport);
        if (ctx.state !== 'running') {
            // Nothing will arrive until the browser lets the audio clock run,
            // and this line is the only place that can say so -- it used to
            // overwrite the "tap to start" message within the second, which
            // left a white picture, a zero, and no explanation.
            say(`tap the picture to start — audio is ${ctx.state}`);
        } else if (!paused) {
            const dbfs = inPeak > 0
                ? `${(20 * Math.log10(inPeak)).toFixed(0)} dBFS` : 'silent';
            inPeak = 0;
            say(`${display.taps} taps · ${Math.round(ctx.sampleRate)} Hz · `
                + `${rate.toFixed(0)} col/s · in ${dbfs} · ${blocksIn} blocks`);
        }
        colsSeen = 0;
        lastReport = t;
    }
    requestAnimationFrame(frame);
}

// ---- catching up ----------------------------------------------------------

/// Whether catching up is a thing that makes sense right now.
///
/// Not while the picture is frozen. Pausing stops feeding the engine, so the
/// queue drains on its own and there is nothing left to catch up with -- and an
/// alarm offering to skip forward on a picture somebody deliberately stopped
/// would be answering a question nobody asked. Resuming starts the watch again
/// from nothing, since the queue really is empty by then; a device that cannot
/// keep up re-earns its button in the `LAG_PERSIST_MS` after that, which on the
/// phone this was written for is about a second.
///
/// A file is excluded for a stronger reason than noise: catching up throws
/// audio away, and audio thrown away from a file is a piece of the file missing
/// from the picture, which is not a trade anybody would want. A file also ends,
/// so its backlog is bounded by construction. Live input is the only case where
/// the backlog grows without limit and where the audio dropped was going to be
/// gone in any case.
///
/// `stuck` is excluded because the page is already showing something more
/// important, and restarting the engine would replace that message without
/// fixing what it describes -- a stale `cochlea.wasm` comes straight back.
function catchUpApplies() {
    return !!ctx && ctx.state === 'running' && !paused
        && !!micSource && !playingFile && !stuck;
}

/// Which frequency the button is centred on, and how far in from the picture's
/// left edge it sits.
///
/// 500 Hz because it is the middle of the part of the picture anybody is
/// looking at -- speech, and the first few harmonics of most things -- so the
/// button lands where the eye already is. It is also one of the octave labels
/// the frequency scale draws, so it sits on a line that is there rather than
/// somewhere between two.
///
/// The inset is a comfortable gap rather than a flush edge: hard against the
/// picture's left the button would read as part of the frequency gutter.
const CATCHUP_HZ = 500;
const CATCHUP_INSET = 16;

/// Put the button where the picture is, in the page's own units.
///
/// Recomputed each time it is shown rather than once, because everything it
/// depends on moves: turning the waveform strip on pushes the picture down by
/// its whole height, a change of ERB changes which tap 500 Hz falls on, and a
/// resize changes the canvas. None of those are events this could listen for
/// without listening for all of them.
/// False when the display cannot say where 500 Hz is, which is the state before
/// the engine has reported its geometry. The caller keeps the button hidden
/// rather than showing it somewhere arbitrary: with nothing written into `left`
/// and `top` it would sit at the corner of the picture with half of it above
/// the top edge, which reads as a rendering fault rather than as a warning.
function placeCatchUp(b) {
    const at = display.anchorFor(CATCHUP_HZ);
    if (!at) return false;
    b.style.left = `${Math.round(at.x + CATCHUP_INSET)}px`;
    b.style.top  = `${Math.round(at.y)}px`;
    return true;
}

/// Put the button up, or take it down, and keep the figure on it current.
function updateCatchUp() {
    behind = catchUpApplies()
          && (performance.now() - lastCaughtUp) > LAG_PERSIST_MS;
    const b = $('catchup');
    // Written before it is unhidden, so it never appears at last time's
    // position and then jumps -- which with the strip toggled between two
    // appearances would be a jump of a hundred and twenty pixels.
    if (behind) {
        b.textContent = `Catch up — ${(lagMs / 1000).toFixed(1)} s behind`;
        if (!placeCatchUp(b)) behind = false;
    }
    b.hidden = !behind;
}

/// Forget what has been measured so far.
///
/// Called wherever the stream of columns is about to be interrupted -- a change
/// of source, a rebuild of the engine. `lastCaughtUp` only ever moves when a
/// measurement arrives *under* the threshold, so an interval with no columns in
/// it ages exactly like a backlog that will not drain: an ERB change on a slow
/// connection, or a microphone that was never granted and is started minutes
/// later, would otherwise put the button up on the strength of a gap.
function resetLagWatch() {
    lagMs = 0;
    lastCaughtUp = performance.now();
    behind = false;
    $('catchup').hidden = true;
}

/// Throw the backlog away and start the engine again from now.
///
/// Terminating the worker is not heavy-handedness, it is the only mechanism
/// there is. A message asking the worker to skip its backlog would be posted
/// *behind* that backlog and read only after the work it was meant to cancel
/// had already been done; `postMessage` is a queue and nothing jumps it. The
/// alternatives are a SharedArrayBuffer, which needs cross-origin isolation the
/// site does not have, or moving the queue onto this thread so it can be
/// emptied -- a rewrite of the audio path to fix a fault that affects one
/// device in ten. `terminate()` discards the queue with the thread that owns it.
///
/// Rebuilding costs a coefficient fetch, which is in the cache, and a cascade
/// build, some two hundred milliseconds. Against three seconds of backlog that
/// is not a cost worth avoiding.
///
/// The picture is kept: the geometry is unchanged, so `setGeometry` resizes to
/// the same width and returns without touching it. The recording is not, and
/// cannot be -- `written` has advanced across audio no column will ever stand
/// for. The 'ready' handler already resets it, for exactly this reason, and
/// `slice` already clamps to what is still held, so Play Selection over the
/// older part of the picture plays what there is of it.
function catchUp() {
    // Asked again here, not taken from `behind`. The button's visibility is
    // decided once a second, so for up to a second after opening a file,
    // pressing Space or losing the microphone it is still on screen and still
    // clickable -- and every one of those makes this the wrong thing to do.
    // Zeroing `samplesSent` during a file is the worst of them: `fileEndsAt`
    // was set from the old count, so the end of that file could never be
    // reached by counting and the picture would lose the piece of the file that
    // was in the queue. `updateCatchUp` is now also called at each of those
    // transitions, so this is the second of two guards rather than the only
    // one; it is the one that closes the window.
    if (!worker || !ctx || !catchUpApplies()) {
        // A press that does nothing has to say so. The button vanishing is
        // some kind of answer, but not one that explains itself, and the whole
        // of this feature's credibility is that it only ever appears when it
        // means something.
        updateCatchUp();
        sayFor(3000, 'nothing to catch up');
        return;
    }
    // Read before `resetLagWatch` clears it. This is the size of the hole about
    // to be made, measured to the sample, and it is the only place that knows
    // it -- the seam on the picture is one line wide whether it covers forty
    // milliseconds or four seconds.
    const droppedMs = lagMs;
    // The new worker first, and the old one killed only once it exists. The
    // other order has a failure with no way back: if `new Worker` throws --
    // and it can, the page having been served from something that has since
    // gone away -- the old worker is already dead, `postMessage` to a
    // terminated worker is a silent no-op, and audio flows into nothing for the
    // rest of the session behind an error message about something else.
    const old = worker;
    try {
        startWorker();
    } catch (e) {
        fail(`worker: ${e.message || 'could not be started'}`);
        return;
    }
    // Only now. Marked before the restart, a `new Worker` that threw would have
    // left a red line across the picture claiming a discontinuity that never
    // happened -- and left the button up, so the next press would draw another.
    // The seam belongs to the last column drawn from the old audio, which is
    // still the newest column: nothing has been appended since the check above.
    // Live input cannot be paused, only abandoned; this is the same lie the
    // pause seam exists to prevent, arrived at from the other direction.
    display.mark('seam');
    old.terminate();
    // Both counters restart together or the difference between them stops
    // meaning anything: the new worker's `consumed` begins at zero, and a
    // `samplesSent` that did not would read the whole session as backlog and
    // leave the button up for ever. Nothing can be posted between these lines
    // -- a message handler cannot interleave with synchronous code -- so the
    // two are zeroed as one.
    samplesSent = 0;
    // Not left to the 'ready' handler, which does it too but two hundred
    // milliseconds from now. Until then `capturing()` is still true, so blocks
    // arriving after the seam would be appended to the recording under the old
    // segments' origins -- post-seam audio mapped through pre-seam arithmetic.
    // Nothing lasting, since 'ready' wipes it, but it costs one line to not do.
    recorder.reset(ctx.sampleRate);
    recordedPerColumn = 0;
    recordedLag = -1;
    resetLagWatch();
    openEngine();

    // A device that cannot sustain the cascade will build the queue straight
    // back, and this button is then a treadmill: press, twenty seconds, press.
    // The second press inside a minute is the moment to stop describing the
    // mechanism and name the things that would actually help -- all of which
    // reduce the engine's work rather than the queue's length. The close-up is
    // named first because it multiplies the engine's column rate by its own
    // factor and is the largest of them by far.
    const now = performance.now();
    const again = now - lastCatchUpAt < 60000;
    lastCatchUpAt = now;
    sayFor(again ? 8000 : 4000, again
        ? 'still behind — try turning the close-up off, or a slower Speed'
        : `caught up — ${(droppedMs / 1000).toFixed(1)} s of sound discarded`);
}

$('catchup').onclick = catchUp;

// Coming back to a page that was in the background is the one case the duration
// test cannot absorb on its own. A backgrounded tab keeps capturing but gets a
// throttled share of the processor, so even a fast machine builds a queue while
// nobody is looking -- and it builds it during exactly the interval in which
// `lastCaughtUp` is not being advanced, so the age carries across the return
// and the button is up on the first tick. That queue drains in a second or two
// on a machine that is fine. Giving the watch its window back costs a device
// that genuinely cannot keep up nothing: it re-earns the button almost
// immediately.
document.addEventListener('visibilitychange', () => {
    if (!document.hidden) resetLagWatch();
});

/// Follow the element, not the window.
///
/// A `resize` event on `window` is about the window, and inside a frame the
/// frame can be resized without the window ever changing -- which is exactly
/// what happens when the page around it grows. Observing the canvas catches
/// both, and is the only thing that works in both the standalone page and the
/// framed one.
let lastWidth = 0;
const refit = () => {
    display.resize();
    // Only when the column count really moved. applyCloseUp writes to
    // localStorage, and calling it on every observation is both wasteful and a
    // way to keep the observer busy.
    if (display.width !== lastWidth) {
        lastWidth = display.width;
        // Half the picture is the close-up strip's ceiling, so a change of
        // width can make the current strip illegal.
        applyCloseUp();
    }
};
try {
    new ResizeObserver(refit).observe(view);
} catch {
    window.addEventListener('resize', refit);
}

// Start listening without being asked to.
//
// Nothing about the page is interesting until sound is going through it, and
// a button that must be pressed before anything happens is a button between
// the visitor and the only thing they came for.
//
// It cannot simply be done, though. `getUserMedia` needs permission, which on
// a first visit means a prompt; and an AudioContext will not run until the
// page has been interacted with. So: ask, and if either says no, fall back to
// the button and to `resumeAudio`'s one-shot listener. A refusal here is a
// quiet no-op, not an error -- the visitor may be about to open a file.
(async () => {
    // If the browser can tell us the answer without prompting, use it: an
    // unheralded permission dialog on load is worse manners than a button.
    // Safari has no 'microphone' descriptor and throws, in which case asking
    // is the only way to find out.
    if (TEST_MODE) { await startTestSignal(); return; }
    let known = null;
    try {
        known = (await navigator.permissions.query({ name: 'microphone' })).state;
    } catch {}
    if (known === 'denied') return;
    await startMic({ quiet: true });
})();
</script>

</body>
</html>
