<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The version in parentheses is stamped in by `serve.sh` on the way out and
     by `publish.sh` on the way to the mirror, both reading
     CFBundleShortVersionString from the Mac app's Info.plist. One number, in
     one place: a copy written here by hand would be a second thing to bump,
     and two versions of the same instrument quietly disagreeing about which
     version they are is worse than neither saying. What is in the repository
     says "dev", which is what an unstamped tree is. -->
<title>Cochleagram (dev)</title>
<style>
  :root {
    color-scheme: light dark;
    --chrome: #f2f2f5;
    --label: #71717a;
    --line: #d4d4d8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --chrome: #1c1c1f; --label: #a1a1aa; --line: #3f3f46; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--chrome);
    display: flex; flex-direction: column;
  }
  .bar {
    display: flex; align-items: center; gap: 0.9rem;
    padding: 0.45rem 0.75rem; flex: 0 0 auto; flex-wrap: wrap;
  }
  .bar + .bar { border-top: 1px solid var(--line); }
  #bars { border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  .bar label { display: flex; align-items: center; gap: 0.35rem; }
  button, select { font: inherit; }
  button { padding: 0.3rem 0.8rem; border-radius: 6px; }
  #status { margin-left: auto; color: var(--label);
            font-variant-numeric: tabular-nums; }
  /* The button sits *on* the picture rather than in the control bars. On a
     phone the bars wrap to several rows and the picture is what fills the
     screen, so a control up there can be off-screen entirely -- and this is the
     one control that is no use unless it is seen the moment it appears.
     `#stage` exists only to give it something to be positioned against. */
  #stage { position: relative; flex: 0 0 auto; }
  /* Red, because it is the only control on the page that reports a fault
     rather than offering a setting, and it is on screen only while that fault
     is. Its own colours rather than the theme's: this one must read the same in
     both, and a device that is failing to keep up is not the moment to be
     subtle. Tabular figures so the seconds it shows do not jitter the width
     while it sits there.
     `left` and `top` are written by `placeCatchUp`, from the display's own
     geometry: the left edge of the picture and the height of 500 Hz. The
     translate takes the button's own height off, so what is aligned with that
     frequency is its middle rather than its top.
     The shadow is not decoration. The button lands on whatever the picture
     happens to be showing, which at the black end is a solid dark field, and a
     red rectangle on it needs an edge that is neither the picture's ink nor its
     paper. */
  #catchup { background: #e5484d; color: #fff; border: 1px solid #c62a2f;
             font-variant-numeric: tabular-nums;
             position: absolute; transform: translateY(-50%);
             z-index: 2; white-space: nowrap;
             box-shadow: 0 1px 6px rgba(0, 0, 0, 0.45); }
  #file { display: none; }
  /* The file's name reads as a caption, not a control. Plain end-truncation
     with the whole of it in the tooltip: `direction: rtl` would keep the more
     distinguishing tail of the name, as the Mac app's middle-truncation does,
     but it reorders punctuation in a Latin filename and the failure looks
     like corruption rather than like eliding. */
  #fname { color: var(--label); max-width: 16rem; overflow: hidden;
           text-overflow: ellipsis; white-space: nowrap; }
  #replay { font-size: 1.05em; line-height: 1; }
  input[type=range] { width: 8rem; }
  .rule { width: 1px; height: 18px; background: var(--line); }
  /* The picture is a fixed 600 pixels tall, whatever the window does.
     599 taps into 600 rows is one tap per pixel -- no vertical resampling,
     which is the whole point: harmonics sit one or two taps apart and
     interpolation destroys exactly that. A window too short to show it all
     scrolls; it does not squeeze.
     616 = the 600 of picture plus the 8 above and 8 below that the display
     reserves for the top label's overhang and the bottom edge.
     This value is what shows until display.js has run; from then on the
     display owns the height, because the waveform strip adds to it rather
     than taking from the picture. See PICTURE_HEIGHT there -- the arithmetic
     is the same and the two have to agree. */
  #view { flex: 0 0 auto; width: 100%; height: 616px; display: block; }
  #view.drop { outline: 3px solid #0a68d0; outline-offset: -3px; }
</style>
</head>
<body>

<div id="bars">
  <div class="bar">
    <button id="pause" title="Pause">❚❚</button>
    <div class="rule"></div>
    <!-- ERB ahead of the file group, so that the two things that appear when
         a file is played -- its name and the Replay button -- grow into the
         empty space at the end of the row instead of shoving everything to
         their right along. A control that moves when you did not touch it
         reads as a different control. The Mac app has had this order all
         along; this row had it backwards. -->
    <label>ERB
      <select id="erb">
        <option value="050">0.5</option><option value="060" selected>0.6</option>
        <option value="070">0.7</option><option value="080">0.8</option>
        <option value="090">0.9</option><option value="100">1.0</option>
        <option value="110">1.1</option><option value="120">1.2</option>
        <option value="130">1.3</option>
      </select>
    </label>
    <div class="rule"></div>
    <!-- RePlay: hearing what the picture shows. A group of two, because
         neither is any use alone, with a line on each side -- the one above is
         the left. Hidden rather than disabled when it does not apply: a
         disabled control is an invitation with a reason to find, and this one
         applies only to a frozen live picture, which is a state you are either
         in or not. The button is sized for its longer title so that changing
         to "Stop" does not shove the file controls along. -->
    <button id="playsel" style="min-width: 8.5em"
            title="Play the sound the picture was drawn from. With no measurement lines this is the whole width of the display; with one line it starts there; with two it plays what is between them."
            hidden>Play Selection</button>
    <input type="range" id="vol" min="-40" max="12" step="1" value="0"
           title="How loud. Unity — the level the microphone heard — is towards the right; the far left is silent."
           hidden>
    <div class="rule" id="selrule" hidden></div>
    <button id="open">Play file…</button>
    <button id="replay" title="Play the same file again" hidden>&#8635;</button>
    <span id="fname" hidden></span>
    <input type="file" id="file" accept="audio/*">
    <span id="status">idle</span>
  </div>
  <!-- Grouped by what a control is about, separators between the groups:
       how the picture is drawn, then what part of the sound it shows, then
       the exposure pair (Auto gain drives Sensitivity, so they belong
       together), then the width of the grey scale, then Defaults. -->
  <div class="bar">
    <label><input type="checkbox" id="invert"> Invert</label>
    <label><input type="checkbox" id="deskew"> De-skew</label>
    <!-- The two readouts. Both are about the picture rather than about what
         part of the sound it shows, so they belong in this first group. -->
    <label><input type="checkbox" id="waveform"
      title="The sound the picture was drawn from, above it and sharing its columns"> Waveform</label>
    <label><input type="checkbox" id="spectrum"
      title="The newest column stood on its side, to the right of the picture. Drag the line between them to change how much room it gets."> Spectrum</label>
    <div class="rule"></div>
    <label>Speed
      <!-- Filled from COLUMN_STEPS at startup, so the detents cannot drift
           away from the Mac app's. -->
      <select id="speed"></select>
    </label>
    <label>Close-up
      <select id="closeup" title="Give the most recent moment its own, finer time scale on the right"></select>
    </label>
    <div class="rule"></div>
    <!-- The values here are overwritten by applySettings() before anything is
         wired up; they match `defaults` so that the controls do not flicker
         through a different position on the way. -->
    <label>sensitivity <input type="range" id="sens" min="0" max="200" value="95"></label>
    <label><input type="checkbox" id="auto"> Auto gain</label>
    <div class="rule"></div>
    <label>range <input type="range" id="rng" min="5" max="200" value="170"></label>
    <div class="rule"></div>
    <button id="reset" title="Put the display controls back to their starting values. Speed and ERB are left as they are.">Defaults</button>
  </div>
</div>

<div id="stage">
  <canvas id="view"></canvas>
  <!-- Only on a device that cannot keep up, and only once it has stayed behind
       rather than merely stumbled. It says how far behind as well as what
       pressing it does, so what a visitor can report is a number rather than an
       impression.
       On the picture rather than in the bars above: on a phone those wrap to
       several rows and can be scrolled off entirely, and a warning nobody sees
       is the same as no warning. Its position comes from `placeCatchUp`. -->
  <button id="catchup"
          title="The engine is behind the microphone by more than it can make up, and it will stay behind. Press to throw away the backlog and start again from now. What was missed is marked on the picture; the sound behind the picture starts again too."
          hidden>Catch up</button>
</div>

<script type="module">
import { Display } from './display.js?v=DEV';
import { CLOSE_UP_SPANS, closeUpFit, closeUpAvailable,
         COLUMN_STEPS, columnLabel, nearestColumnStep } from './closeup.js?v=DEV';

const $ = id => document.getElementById(id);
const view = $('view');
const display = new Display(view);
/// Once something has gone wrong, it stays on screen.
///
/// The periodic readout used to overwrite every message within the second,
/// including the ones that said why nothing was working. A failure you have to
/// catch in the act is a failure nobody reports properly.
let stuck = null;
/// Until when the line is spoken for. The same problem as `stuck` but for
/// messages that are worth a moment rather than for ever: the periodic readout
/// runs once a second, so a sentence written in answer to a button press is
/// gone before it has been read. Anything that reports what a press *did* has
/// to hold the line for longer than the interval that overwrites it.
let sayHold = 0;
const say = t => {
    if (!stuck && performance.now() >= sayHold) $('status').textContent = t;
};
/// Say it, and keep it there for `ms`.
const sayFor = (ms, t) => {
    if (stuck) return;
    sayHold = 0;                       // this one outranks whatever is holding
    say(t);
    sayHold = performance.now() + ms;
};
const fail = t => { stuck = t; $('status').textContent = '⚠ ' + t; };

// Counters, so it is possible to say *where* the chain stops rather than only
// that it stopped: blocks leaving the audio thread, and columns coming back
// from the engine. Blocks but no columns means the engine; neither means the
// microphone.
let blocksIn = 0;
/// Bumped by everything that starts a source. Starting is not atomic -- there
/// is a permission prompt, a decode, an audio clock to wake -- and the old
/// code stopped the previous source *before* those waits and published the new
/// one after, so anything starting in between was invisible to it. A click on
/// Replay during the microphone permission prompt left both connected to the
/// analyser at once. A start whose number is no longer current gives up.
let startGen = 0;
/// Identifies the most recent end-of-file, so a stale flush reply -- from a
/// file that was interrupted by another -- cannot freeze the new one.
///
/// Moved in two places, and it needs both: when a flush is asked for, and in
/// `stopSources`, when whatever might have asked for one is taken away. For a
/// while it moved only on the first, which meant a flush already in flight
/// stayed current across an interruption and froze the file that followed.
let endToken = 0;
/// Samples handed to the worker since the page loaded, and the count at which
/// the file running now stops being the file.
///
/// The end of a recording is a fact about the *audio*, not about when a
/// callback fires. `onended` arrives on the main thread after the worklet has
/// already captured and posted the silence that follows the file, so a flush
/// sent from there drains that silence into the picture first -- some 35 ms of
/// it, which pushed the whole response further from the right edge than the
/// Mac app put it. Counting samples puts the boundary where the audio does.
let samplesSent = 0;
let fileEndsAt = 0;

// ---- falling behind -------------------------------------------------------
//
// The chain from microphone to picture has no back-pressure anywhere in it.
// The capture worklet posts a block every few milliseconds because the audio
// thread runs on the audio clock and cannot be asked to wait; the engine worker
// takes them as fast as the machine allows. On a device that sustains the
// cascade the difference is a block or two. On one that does not -- a 2020
// phone that throttles after a few minutes of it -- the difference grows for as
// long as the page is open, and it does not come back, because draining a
// backlog needs the machine to run faster than real time and a machine that
// could do that would not have built one. Reported at three seconds behind on a
// Galaxy S20; other devices show nothing.
//
// So: measure it, say nothing while it is small or brief, and offer a way back
// when it is neither.

/// A backlog worth a button, in milliseconds.
///
/// This measures the queue and nothing else. The engine's own group delay --
/// 186 ms at ERB 0.6 with De-skew on, see `displayLagMs` -- is deliberately not
/// part of it: that is latency, not backlog, it is the same on every machine,
/// it is what the picture is *for*, and RePlay already corrects for it. So the
/// figure on the button understates the delay a person actually perceives, by
/// that much plus the capture buffer, and understating is the right direction
/// for a control that throws sound away. Do not be tempted to add
/// `displayLagMs()` into it; that would move this threshold without moving the
/// number, which is the sort of change that looks like an improvement.
///
/// 100 is close to the floor rather than clear of it, and that is deliberate.
/// A machine that is keeping up sits at three to twenty milliseconds -- a block
/// or so in flight, plus however many blocks were posted ahead of the columns
/// message being read -- but a long task on either thread reaches fifty or a
/// hundred by itself, and the reading is biased upward by roughly a frame's
/// worth of blocks besides. So a hundred milliseconds is a level a healthy
/// machine does touch, and this threshold on its own would be twitchy.
///
/// What makes it safe is that it is not on its own. `LAG_PERSIST_MS` below asks
/// the backlog to still be there a second later, and the whole difference
/// between a long task and a machine that cannot keep up is that the first one
/// drains and the second cannot. Lowering this number moved work onto that
/// test; it did not remove it. If this ever proves twitchy in the field, the
/// knob to reach for is the persistence, not this -- a tenth of a second really
/// is the point at which the picture stops being live, and the display should
/// say so.
const LAG_WARN_MS = 100;

/// How long the backlog has to stay above that before it is worth saying.
///
/// This is the whole of the transient/permanent distinction, and it is a test
/// on duration rather than on size for a reason: a garbage collection, a scroll
/// or a long task all make a spike of several hundred milliseconds, and
/// magnitude cannot tell one of those from a real backlog at the moment it
/// happens. Whether it comes back down can, because draining needs the machine
/// to run *faster* than real time. A machine that is keeping up has that in
/// hand -- a desktop runs the cascade several times over -- and clears a
/// half-second spike in a fraction of a second. A machine that is not never
/// clears anything.
///
/// One second, not the five this began as. A tenth of a second of backlog is
/// already worth acting on, and a test that took five seconds to say so was
/// reporting the fault fifty times later than the fault itself. A second is
/// still several times what a healthy machine needs to drain a spike.
///
/// With `LAG_WARN_MS` down at 100 this test is carrying most of the weight: it
/// is now the only thing standing between a long task and a false alarm, where
/// at 500 the level did much of that work by itself. That is the right place
/// for the weight to sit -- "did it drain" is the question that actually
/// distinguishes the two cases -- but it means this constant should be raised,
/// not the other one lowered, if the button ever proves twitchy.
const LAG_PERSIST_MS = 1000;

/// How often the test above is applied.
///
/// Its own clock rather than the status line's once-a-second tick, which is
/// where this used to live. The granularity of the report has to be small
/// against what is being reported, and a tenth of a second is not small against
/// one.
const CATCHUP_CHECK_MS = 100;

/// What share of real time to make the engine consume: `?slow=1.2` means it
/// spends 1.2 seconds on every second of audio.
///
/// 1 is exactly real time, and the backlog then holds at whatever it is.
/// Above 1 it grows, below 1 it drains. The number means the same thing on
/// every machine -- see the worker, which measures from before the cascade
/// rather than adding to it, so the real cost is inside the figure rather than
/// underneath it.
///
/// Without this the feature cannot be tested on a machine that works, and the
/// browser's own CPU throttling is no substitute: **it applies to the page's
/// main thread and not to workers**, so it does nothing whatever to the
/// cascade. That is not a subtlety to rediscover -- 6x, 4x and off all behave
/// identically here, which reads as the throttle being broken.
///
/// A share F loses `(F-1)/F` of every second, so with the constants above 1.05
/// gains 48 ms of backlog a second and puts the button up after about 3
/// seconds, 1.1 gains 91 and takes about 2, and 1.5 gains 333 and takes a
/// little over 1. Nothing can be faster than `LAG_PERSIST_MS`, which is the
/// point of it. The phone's own deficit is a few per cent -- 1.02 or so, which
/// takes a couple of minutes and is the honest reproduction if there is time
/// for it.
///
/// Diagnostic, like `?test`: no control, no mention on the page, inert unless
/// asked for.
const SLOW_FACTOR = (() => {
    const v = parseFloat(new URLSearchParams(location.search).get('slow'));
    return Number.isFinite(v) && v > 0 ? Math.min(v, 10) : 0;
})();

/// The backlog, in milliseconds: audio handed to the worker that has not yet
/// become columns. Updated whenever columns arrive, which is many times a
/// second whether or not there is any sound.
let lagMs = 0;
/// When the backlog was last under `LAG_WARN_MS`. Every brief spike resets it,
/// so the only thing that can age is a backlog that stayed.
let lastCaughtUp = performance.now();
/// Whether the button is up. Kept rather than recomputed at the point of use so
/// that the one decision is made in one place, once a second.
let behind = false;
/// When the last catch-up was, so a second one soon after can say something
/// more useful than the first.
let lastCatchUpAt = -Infinity;

/// Mark the end of the recording and stop, once the engine has caught up.
///
/// The picture is left frozen on purpose: the end of a file is when you want
/// to measure what you have just seen. Anything arriving from here is the
/// player rendering silence, and it is dropped rather than queued -- the
/// columns handler already discards while paused.
function finishFile() {
    display.mark('fileEnd');
    fileEnded = true;
    // Both of these used to be left to `src.onended`, and that is a race this
    // loses about as often as it wins. The flush is asked for the instant the
    // sample count reaches the end of the file, while `ended` lags the audio
    // by tens of milliseconds -- so when the worker replies quickly, this runs
    // first. It then froze the picture with `playedThrough` still false, which
    // hides Replay, and nothing afterwards recomputed the button: every other
    // `showTransport` belongs to something *starting*. A paused picture with
    // no Replay and no way on but the microphone.
    //
    // A flush reply whose token is still current means the file did reach its
    // end, so this is the authority on that, not `ended`.
    playedThrough = true;
    // And `playingFile` has to go before `setPaused`, or the suspend below
    // takes the "a file is genuinely paused" branch and suspends the context
    // while the source is still rendering. `ended` is then deferred until
    // something resumes -- and everything that resumes clears `fileSource`
    // first, so the handler returns early and the flag is never set at all.
    playingFile = false;
    setPaused(true, false);        // no seam: the green line already says it
}
/// Loudest input sample since the status line was last written, so the figure
/// shown is a peak over the last second rather than an average over all time.
let inPeak = 0;

window.addEventListener('error', e => fail(`${e.message} (${e.filename}:${e.lineno})`));
window.addEventListener('unhandledrejection',
    e => fail('unhandled: ' + (e.reason && e.reason.message || e.reason)));

/// Diagnostic mode, reached by adding ?test to the URL. No button and no
/// mention on the page: it is not a feature, it is a way to tell an input
/// fault from a display fault on a device that will not give you either a
/// console or a file.
const TEST_MODE = new URLSearchParams(location.search).has('test');

let ctx = null, capture = null, worker = null;
let micStream = null, micSource = null, fileSource = null;
/// The last file played, kept so it can be played again without a second trip
/// through the picker -- the Mac app's Replay button, which the browser was
/// missing along with the name of the file it is showing you.
///
/// The decoded buffer rather than the `File`: a `File` is a handle to
/// something on disk that may since have moved, and decoding it again is work
/// already done.
let lastBuffer = null, lastName = '';
/// Whether the last file ran to its end, which is what Replay's visibility is
/// derived from. A file that was interrupted has somewhere to resume from; one
/// that finished has only somewhere to start again.
let playedThrough = false;

let playingFile = false, paused = false, fileEnded = false;
let colsSeen = 0, lastReport = performance.now();
/// When the backlog test last ran. Separate from `lastReport` because the two
/// run at different rates and for different reasons.
let lastCatchUpCheck = 0;

// ---- RePlay: the audio behind the picture ---------------------------------
//
// A port of `ReplayRecorder` in the Mac app's AudioSource.swift, doing the
// same arithmetic. Read REPLAY-DESIGN.md before changing either.
//
// Where the Mac app drains a ring inside the engine, this keeps its own copy:
// the capture worklet posts every block to *this* thread on its way to the
// worker, so the samples are already here and asking the engine for them again
// would be a second recording in the WASM heap. That is the only difference.

/// Round the way Swift's `Double.rounded()` does -- half away from zero, where
/// `Math.round` takes half towards positive infinity. It is one sample at an
/// exact half, and the two apps have to give the same answer or comparing them
/// stops being the point.
const rounded = x => (x < 0 ? -Math.round(-x) : Math.round(x));

class ReplayRecorder {
    constructor() { this.reset(0); }

    /// Throw everything away and start again -- a new input device, a new
    /// engine, or a wiped picture.
    reset(rate) {
        /// One stretch of recording at one column rate and one display lag.
        ///
        /// A list rather than a single origin, because three ordinary actions
        /// break the correspondence without wiping the picture: changing Speed
        /// changes how much audio a column stands for; resuming after a pause
        /// starts recording again after an interval that is in neither the
        /// picture nor the recording; and De-skew moves the whole picture by
        /// nearly two hundred milliseconds. Everything drawn before the change
        /// still has to map correctly, so the old terms are kept.
        this.segments = [];
        /// Blocks as they arrived, oldest first, and how many samples they hold
        /// between them. Kept as a list rather than one array because trimming
        /// then drops whole blocks off the front instead of moving everything
        /// that survives.
        this.blocks = [];
        this.held = 0;
        /// Stream position of the first sample still held.
        this.base = 0;
        /// Total ever taken, so a position means the same thing for ever.
        this.written = 0;
        this.rate = rate;
    }

    get isEmpty() { return this.held === 0 || this.segments.length === 0; }
    /// Where the oldest sample still held sits in the stream.
    get oldestSample() { return this.base; }

    /// Begin a new stretch: engine column `column` is the next one that will be
    /// drawn, and it stands for audio that arrived `lagSamples` ago.
    ///
    /// The lag is folded into the stretch's own origin rather than kept as a
    /// term of its own, so every mapping downstream is the same arithmetic it
    /// would otherwise have been. It can put the origin before the start of the
    /// recording, which is not an error: at the beginning of a stretch the
    /// first columns really were drawn from audio nobody was keeping yet, and
    /// the callers clamp.
    beginSegment(column, perColumn, lagSamples) {
        if (!(perColumn > 0)) return;
        const seg = { column, sample: this.written - lagSamples, perColumn };
        const last = this.segments[this.segments.length - 1];
        // A stretch describing no columns yet is replaced rather than stacked:
        // two at the same place would only be one, and Speed or De-skew can be
        // changed twice while paused.
        if (last && last.column === column) {
            this.segments[this.segments.length - 1] = seg;
            return;
        }
        this.segments.push(seg);
    }

    take(block) {
        if (!block.length) return;
        this.blocks.push(block);
        this.held += block.length;
        this.written += block.length;
    }

    /// Where an engine column begins, in the recording, or null.
    sampleForColumn(g) {
        let i = -1;
        for (let k = this.segments.length - 1; k >= 0; k--) {
            if (this.segments[k].column <= g) { i = k; break; }
        }
        if (i < 0) return null;
        const s = this.segments[i];
        return s.sample + rounded((g - s.column) * s.perColumn);
    }

    /// The engine column a position in the recording belongs to.
    ///
    /// Not a search on `sample`, which would be the obvious thing and is wrong.
    /// Stretches are ordered and monotone in column but *not* in sample:
    /// turning De-skew on holds the picture back, so the stretch beginning at
    /// the toggle starts from audio the one before it has already used. The
    /// overlap is real -- it is what the seam is saying -- and a search for the
    /// last stretch starting at or before `at` would jump forward the instant
    /// the new one began.
    ///
    /// So the walk is forward, from the stretch `from` lies in, and it steps
    /// only when `at` has passed the boundary expressed in the current
    /// stretch's own terms. Columns are contiguous across a boundary even when
    /// samples are not, which is what makes that well defined.
    columnForSample(at, from) {
        let i = -1;
        for (let k = this.segments.length - 1; k >= 0; k--) {
            if (this.segments[k].column <= from) { i = k; break; }
        }
        if (i < 0) return null;
        while (i + 1 < this.segments.length) {
            const s = this.segments[i], next = this.segments[i + 1];
            const boundary = s.sample
                + rounded((next.column - s.column) * s.perColumn);
            if (at < boundary) break;
            i++;
        }
        const s = this.segments[i];
        const g = s.column + rounded((at - s.sample) / s.perColumn);
        // The line only ever moves forward, and `from` alone does not ensure
        // it. Turning De-skew *off* is the mirror of turning it on: the audio
        // between the boundary and the new stretch's origin belongs to no
        // column at all, and extrapolating the new stretch's formula backwards
        // over that gap lands inside the previous stretch's columns.
        return Math.max(g, s.column, from);
    }

    /// Drop everything older than engine column `oldest`, the left-hand edge of
    /// the picture. This is the whole of the memory policy: the recording is as
    /// long as the picture is wide and no longer, so it grows with Speed and
    /// with the window and needs no ceiling of its own.
    trim(oldest) {
        const cut = this.sampleForColumn(oldest);
        if (cut === null || cut <= this.base) return;
        // Whole blocks only. Dropping part of one would mean copying the rest,
        // which is the cost this shape exists to avoid.
        while (this.blocks.length && this.base + this.blocks[0].length <= cut) {
            const b = this.blocks.shift();
            this.base += b.length;
            this.held -= b.length;
        }
        let keep = 0;
        for (let k = this.segments.length - 1; k >= 0; k--) {
            if (this.segments[k].column <= oldest) { keep = k; break; }
        }
        // The stretch covering the new left edge stays; the ones entirely
        // behind it describe audio nobody can reach any more.
        if (keep > 0) this.segments.splice(0, keep);
    }

    /// The audio between two engine columns, exclusive of the last, as one
    /// Float32Array, or null when none of it is still held.
    slice(lo, end) {
        if (end <= lo) return null;
        let b = this.sampleForColumn(end);
        if (b === null) return null;
        // The left-hand end is clamped up to the oldest sample still held
        // rather than refused. The picture is deliberately kept across some of
        // the things that restart the recording -- a change of input device, or
        // of ERB -- so for one screen width afterwards the left of the picture
        // is older than anything recorded. Playing what there is of it is the
        // useful answer.
        let a = this.sampleForColumn(lo);
        if (a === null) a = this.base;
        // A span across a De-skew seam can run backwards: for a selection
        // narrower than the lag the right-hand end names an earlier sample than
        // the left, and there is no honest span between them. What there is, is
        // the sound the left end names for as long as the selection is wide on
        // that side of the seam -- never empty, and what a listener reading the
        // left of the picture expects.
        if (b <= a) {
            let s = null;
            for (let k = this.segments.length - 1; k >= 0; k--) {
                if (this.segments[k].column <= lo) { s = this.segments[k]; break; }
            }
            if (s) b = a + rounded((end - lo) * s.perColumn);
        }
        const from = Math.max(0, a - this.base);
        const to = Math.min(this.held, b - this.base);
        if (to <= from) return null;
        const out = new Float32Array(to - from);
        let at = 0, pos = 0;
        for (const blk of this.blocks) {
            const s = Math.max(from, pos), e = Math.min(to, pos + blk.length);
            if (e > s) { out.set(blk.subarray(s - pos, e - pos), s - from); at = e; }
            pos += blk.length;
            if (pos >= to) break;
        }
        return at > from ? out : null;
    }
}

const recorder = new ReplayRecorder();
/// The picture's numbering, the column rate and the display lag when the
/// recorder was last told about them.
let recordedEpoch = -1, recordedPerColumn = 0, recordedLag = -1;
/// Where a playback started, and where it must not pass.
let replayFrom = 0, replayTo = 0, replayFromSample = 0;
/// The playing graph, and when it started.
let replaySource = null, replayGainNode = null;
let replayStarted = 0, replayStartedMs = 0, replaySeconds = 0;
/// Per-tap group delay in seconds, from the engine. What De-skew is made of.
let engineDelays = null;

// ---- what is remembered between visits -----------------------------------
//
// localStorage, which is per-origin: settings from a local server and from
// the published page are separate, which is right -- one is where you try
// things and the other is where you use them.
//
// The source is deliberately not remembered. A file cannot be reopened
// without the user choosing it again, and a page that claimed to resume a
// recording it no longer has would be worse than one that plainly starts
// listening.

const KEY = 'cochleagram.settings';
/// The tunings there are coefficient files for, read off the menu rather than
/// written out again -- the menu is already the list, and a second copy could
/// name a file that does not exist.
const ERB_VALUES = [...$('erb').options].map(o => o.value);
const defaults = {
    columnMs: 4, erb: '060', deskew: false,
    // Auto gain off, and a window from -180 to -10 dB to make up for it.
    //
    // Auto gain would guarantee a picture on any hardware, but it owns
    // sensitivity while it is on, and switching it off hands back wherever the
    // controller had drifted to -- which depends on everything the page has
    // heard since it loaded. This app and the Mac app would then disagree
    // about sensitivity after the same button press unless they had also had
    // the same history, and being able to set the two side by side and get the
    // same picture is worth more than the convenience.
    //
    // So the safe first impression has to come from a fixed window wide enough
    // to survive not knowing the input level. Mean ink over pink and white
    // noise, from the offline engine at ERB 0.6 -- the controller aims for
    // 0.30 when it is choosing for itself:
    //
    //     input   -20   -40   -60   -80  -100  -120 dBFS
    //      pink  0.74  0.62  0.51  0.39  0.28  0.16
    //     white  0.71  0.60  0.48  0.37  0.25  0.14
    //
    // Never a black slab, never blank. The cost is contrast: 170 dB from white
    // to black is a soft picture, and 70/60 -- the window that used to be
    // written -100 to -40 -- is still the one the display is really read at,
    // once you can see where the signal is. That is what the sliders are for.
    invert: false, autoGain: false, sensDB: 95, rangeDB: 170,
    // The two readouts, and how much width the spectrum gets.
    //
    // The Mac's defaults, so that the two apps opened side by side show the
    // same thing. They cost differently, though: out there the spectrum is a
    // window of its own beyond the app and takes nothing from the picture,
    // while in here it can only be paid for in columns -- which is what the
    // draggable boundary is for.
    showWaveform: false, showSpectrum: true, spectrumShare: 0.24,
    // How much of the recent past the close-up strip shows, in milliseconds;
    // zero is off. The *span* is what is stored, not the width, because the
    // width that gives it depends on Speed -- and what you want when you come
    // back is the same amount of time, not the same number of pixels.
    //
    // Off by default. It is the least self-explanatory thing in the window,
    // and a stranger meeting a display already divided into two regions
    // scrolling at different rates would reasonably conclude it was broken.
    closeUpSpanMs: 0, closeUpColumns: 400,
    // How loud Play Selection is, in dB relative to what the microphone heard.
    // Zero -- unity -- so what you hear is the recording, not an opinion about
    // it. The travel runs above unity as well as below because a microphone
    // recording often sits well below full scale and nothing else here can lift
    // it; anything that then exceeds full scale clips, audibly, which is the
    // right thing for an instrument to do. One of the values the two apps have
    // to agree on.
    replayGainDb: 0,
};
/// What the volume slider spans, in dB about unity. Matches
/// `Settings.replayGainRange` in the Mac app.
const REPLAY_GAIN_RANGE = [-40, 12];
/// Which of the defaults the Defaults button restores: all of them except
/// `columnMs` and `erb`.
///
/// Speed and ERB are left wherever they were, because those two say what the
/// picture *is* rather than how it is exposed, and somebody who has chosen a
/// tuning and a time scale and then wants a legible grey scale is not asking
/// to be moved off them. Leaving them also means the engine does not have to
/// be reopened, so the button can be pressed without destroying what is on
/// screen.
///
/// Derived from `defaults` rather than written out again: the button restores
/// a shorter *list* of settings, not a different set of values, and a second
/// copy of the values would only be a way for the two to drift apart. The Mac
/// app's Defaults button omits the same two, for the same reason.
const DISPLAY_KEYS = ['deskew', 'invert', 'autoGain', 'sensDB', 'rangeDB',
                      'closeUpSpanMs', 'closeUpColumns', 'replayGainDb',
                      'showWaveform', 'showSpectrum', 'spectrumShare'];
const displayDefaults =
    Object.fromEntries(DISPLAY_KEYS.map(k => [k, defaults[k]]));
// The window is set by where its middle is and how wide it is, not by its two
// ends. The ends share a scale and so collide: they cannot cross, they need a
// minimum separation, and the guard enforcing it can fail silently at the
// limits -- which it did, giving a one-decibel window and a picture with no
// grey in it. A midpoint and a width cannot interact at all.
//
// Sensitivity is the *negated* midpoint, so that dragging right means more
// sensitive, more ink, a darker picture. Its limits come from a measurement:
// the response is linear, so input level maps one-for-one onto a shift of the
// window -- median tap level runs -53.3 / -103.3 / -153.3 dB for inputs of
// -20 / -70 / -120 dBFS. Covering full scale down to a very quiet phone
// microphone is therefore a midpoint from -10 to -190, rounded out to 200.
//
// Not "the ends should be all white and all black": that guarantee needs the
// window pushed past the tails of the distribution, and the tails are 80 dB
// beyond the first percentile. The last third of the travel would do nothing
// but chase a signal that is not there.
const SENS_LO = 0, SENS_HI = 200;
/// Below about five decibels the picture is a threshold rather than a grey
/// scale. Above two hundred nothing is outside the window to begin with.
const RANGE_LO = 5, RANGE_HI = 200;

// `Number.isFinite` first, because Math.min, Math.max and Math.round all
// propagate NaN rather than rejecting it -- a NaN out of storage would give a
// NaN window, an all-black picture, and no way back except clearing
// localStorage. The old code rejected NaN only by accident, as a side effect
// of a comparison that happened to be false.
const clampTo = (lo, hi, fallback) => v =>
    Number.isFinite(+v) ? Math.min(hi, Math.max(lo, Math.round(+v))) : fallback;
const clampSens  = clampTo(SENS_LO,  SENS_HI,  defaults.sensDB);
const clampRange = clampTo(RANGE_LO, RANGE_HI, defaults.rangeDB);

/// The pair the display actually wants. Kept in one place so the sign of the
/// negation is written down once.
const windowFor = (sens, range) => ({
    whiteDB: -sens - range / 2,
    blackDB: -sens + range / 2,
});

let S = { ...defaults };
let stored = {};
try { stored = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch {}

// Settings stored by an older build name the two ends. Convert rather than
// discard: the window someone left set is the one they want back.
//
// The test is against what came out of storage, not against `S`. Testing `S`
// looks equivalent and is not: `S` starts as a copy of `defaults`, which has
// a sensDB already, so the condition could never be true and every old
// setting was quietly thrown away instead of converted.
if (stored.sensDB === undefined &&
    typeof stored.whiteDB === 'number' && typeof stored.blackDB === 'number') {
    stored.rangeDB = stored.blackDB - stored.whiteDB;
    stored.sensDB  = -(stored.whiteDB + stored.blackDB) / 2;
}
delete stored.whiteDB; delete stored.blackDB;
Object.assign(S, stored);
// Stored settings outlive the code that wrote them, so what comes back in has
// to be made safe rather than trusted -- a browser that once reached a
// one-decibel window would otherwise keep it forever, through every reload.
S.sensDB  = clampSens(S.sensDB);
S.rangeDB = clampRange(S.rangeDB);
S.replayGainDb = Number.isFinite(S.replayGainDb)
    ? Math.min(REPLAY_GAIN_RANGE[1], Math.max(REPLAY_GAIN_RANGE[0], S.replayGainDb))
    : defaults.replayGainDb;
// The tuning has to survive the same treatment, and it is the one that cannot
// be recovered from without knowing about localStorage. A value naming no
// coefficient file leaves the ERB menu blank, asks the worker for a file that
// 404s, and `fail()` is sticky -- so the page shows a warning and never draws
// again, and saves the bad value back on the way. The Mac has
// `nearestErbScale` for exactly this; this is its counterpart.
if (!ERB_VALUES.includes(S.erb)) S.erb = defaults.erb;

function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {}
}

/// Push the stored values at the controls and at the display. Runs before
/// anything is wired up, so nothing here fires a change handler.
// Widest column first, so the scroll gets faster to the right and the label
// "Speed" agrees with the direction -- the same order as the Mac's dials.
for (const ms of [...COLUMN_STEPS].reverse()) {
    const o = document.createElement('option');
    o.value = String(ms);
    o.textContent = columnLabel(ms);
    $('speed').appendChild(o);
}

function applySettings() {
    // Snapped here rather than once on load, so that Defaults goes through it
    // too. The detents are computed as 0.5 x 128^(i/14), and 128^(6/14) is
    // 7.999999999999999 rather than 8 -- so the literal 4 in `defaults` is not
    // the same Double as the 4 in the menu, `select.value` would match no
    // option, and the control would come up blank. It is the same arithmetic
    // the Mac does, and the two agree to within 4e-16 ms, which is what
    // matters more than either being round.
    S.columnMs = COLUMN_STEPS[nearestColumnStep(S.columnMs)];
    $('speed').value = String(S.columnMs);
    $('erb').value = S.erb;
    $('deskew').checked = S.deskew;
    $('invert').checked = S.invert;
    $('waveform').checked = S.showWaveform;
    $('spectrum').checked = S.showSpectrum;
    $('auto').checked = S.autoGain;
    $('sens').value = String(S.sensDB);
    $('rng').value  = String(S.rangeDB);
    $('vol').value  = String(S.replayGainDb);
    // Auto gain owns sensitivity while it is on: the control reports what the
    // controller is doing rather than accepting instructions. Wanting it
    // somewhere else is what turning Auto gain off is for.
    $('sens').disabled = S.autoGain;
    display.exposure.inverted = S.invert;
    display.exposure.autoGain = S.autoGain;
    Object.assign(display.exposure, windowFor(S.sensDB, S.rangeDB));
    display.columnMs = S.columnMs;
    // Clamped on the way in, because it is read back from localStorage and a
    // hand-edited or half-written value would otherwise size the picture.
    display.spectrumShare = Number.isFinite(S.spectrumShare)
        ? Math.min(0.5, Math.max(0.05, S.spectrumShare))
        : defaults.spectrumShare;
    // Last, so the resize it does uses the share just set. Changes the canvas's
    // height and the column count, so anything that depends on the column count
    // has to run after this -- which `applyCloseUp` does, being called below.
    display.setReadouts({ waveform: S.showWaveform, spectrum: S.showSpectrum });
}
applySettings();

// ---- the close-up --------------------------------------------------------

let closeUpK = 1;

/// Push the close-up at both halves of the system, in the order that matters:
/// the display has to know the new geometry before the engine starts producing
/// columns at the new rate, or the first frame's worth arrives to be filed
/// under the old one.
function applyCloseUp() {
    if (!closeUpAvailable(S.columnMs)) S.closeUpSpanMs = 0;
    const on = S.closeUpSpanMs > 0 && !S.deskew;
    const fit = on ? closeUpFit(S.closeUpSpanMs, S.columnMs,
                                display.maxCloseUpColumns, S.closeUpColumns)
                   : null;
    if (on && !fit) S.closeUpSpanMs = 0;      // no legal width at this Speed
    closeUpK = fit ? fit.k : 1;
    if (fit) S.closeUpColumns = fit.columns;
    display.setCloseUp(fit ? fit.columns : 0, closeUpK);
    display.columnMs = S.columnMs;            // the *main* picture's rate
    worker?.postMessage({ type: 'columnMs', value: S.columnMs / closeUpK });
    showCloseUpMenu();
    save();
}

/// Rebuild the span menu, greying out the spans that cannot be drawn.
///
/// Legality is expressed in the control rather than left to be discovered:
/// a span with no divisor satisfying both the engine's floor and the strip's
/// width limits simply cannot be shown, and an entry that did nothing when
/// picked would be worse than one that is visibly unavailable.
function showCloseUpMenu() {
    const sel = $('closeup');
    sel.innerHTML = '';
    for (const span of CLOSE_UP_SPANS) {
        const o = document.createElement('option');
        o.value = String(span);
        o.textContent = span === 0 ? 'off' : `${span} mS`;
        o.disabled = span > 0 && (S.deskew || !closeUpFit(
            span, S.columnMs, display.maxCloseUpColumns, S.closeUpColumns));
        sel.appendChild(o);
    }
    sel.value = String(S.closeUpSpanMs);
    // De-skew works by delaying the whole picture by the apex's group delay,
    // so it has nothing recent to show. The two are mutually exclusive.
    sel.disabled = S.deskew || !closeUpAvailable(S.columnMs);
}

$('closeup').onchange = e => {
    S.closeUpSpanMs = +e.target.value;
    applyCloseUp();
};
display.snapCloseUpWidth = asked => {
    const f = closeUpFit(S.closeUpSpanMs, S.columnMs,
                         display.maxCloseUpColumns, asked);
    return f ? f.columns : 0;
};
display.onCloseUpWidthChanged = cols => {
    S.closeUpColumns = cols;
    applyCloseUp();
};
showCloseUpMenu();
showTransport();

// ---- the machinery -------------------------------------------------------

function startWorker() {
    worker = new Worker('./engine-worker.js?v=DEV', { type: 'module' });
    // A worker that fails to load -- a module that will not import, a WASM
    // module that will not instantiate -- reports here and nowhere else. This
    // was missing, which is why a dead engine looked exactly like a silent
    // room: zero columns, white picture, no explanation.
    worker.onerror = e =>
        fail(`worker: ${e.message || 'failed to load'} `
             + `(${e.filename || 'engine-worker.js'}:${e.lineno || '?'})`);
    worker.onmessageerror = () => fail('worker: message could not be delivered');
    worker.onmessage = ev => {
        const m = ev.data;
        if (m.type === 'ready') {
            display.setGeometry(m.taps, m.frequencies);
            // Kept for RePlay: how far behind the sound the picture is depends
            // on these and on De-skew, and is nearly two hundred milliseconds
            // with De-skew on. See `displayLagMs`.
            engineDelays = m.delays;
            // The recording starts again here, which is the one place that
            // catches every engine reload -- the first open and every change of
            // ERB. Opening an engine nulls the old one and then fetches a
            // coefficient file and builds a cascade, and every block of audio
            // arriving in that window is discarded by the worker while this
            // thread goes on recording it. Left alone, `written` would advance
            // by the whole reload with no columns to show for it, and every
            // column after it would map to audio earlier than the truth -- by
            // more each time ERB was touched. The Mac throws the recording away
            // at the same point, for the same reason.
            stopReplay();
            recorder.reset(ctx ? ctx.sampleRate : 0);
            recordedPerColumn = 0;
            recordedLag = -1;
            // After the reset, and not left to `syncRecorder`. The button's
            // visibility depends on the recorder having something in it, and
            // nothing else here would notice: `stopReplay` above ran while the
            // recorder was still full, `applyCloseUp` only wipes when the fit
            // actually changes, and with an unchanged epoch and rate
            // `syncRecorder` never takes the branch that would have called
            // this. Without it, changing ERB on a frozen picture leaves Play
            // Selection sitting there over an empty recording.
            showReplayControls();
            applyCloseUp();              // the width limit needs the geometry
        } else if (m.type === 'columns') {
            // What is still in the queue in front of the engine, as of now.
            // Both counters are totals over the same stream of samples -- one
            // kept where blocks are posted, one where they are taken -- so the
            // difference is the queue's length and needs no clock.
            //
            // Read as the message lands rather than as it was sent, which
            // overstates it: this message waited behind whatever blocks the
            // worklet posted in the meantime, and each of those advanced
            // `samplesSent`. A frame's worth is six blocks, so the overstatement
            // is some sixteen milliseconds, and a long task makes it more. Two
            // orders below the threshold either way, and in the safe direction.
            if (ctx && ctx.sampleRate && m.consumed !== undefined) {
                lagMs = Math.max(0, samplesSent - m.consumed)
                      / ctx.sampleRate * 1000;
                // Here, where every measurement is seen, rather than in the
                // once-a-second tick that reads it. A machine that is keeping
                // up is under the threshold nearly all the time and it would
                // hardly matter -- but sampling a spiky quantity once a second
                // can land on the spikes, and a test whose whole purpose is to
                // ignore spikes must not be able to see only those.
                if (lagMs < LAG_WARN_MS) lastCaughtUp = performance.now();
            }
            // Dropped rather than queued while frozen. Nothing new is fed to
            // the engine while the picture is stopped, so what reaches here is
            // the tail of what was already in flight -- but that tail is real
            // and a queue of it would replay at high speed on resume.
            if (!paused) {
                display.append(m.levels, m.coherence, m.refs,
                               m.inLo, m.inHi, m.columns);
            }
            colsSeen += m.columns;
        } else if (m.type === 'flushed') {
            // Every column the file produced has now been appended.
            if (m.token === endToken) finishFile();
        } else if (m.type === 'error') {
            fail('engine: ' + m.message);
        }
    };
}

function openEngine() {
    // No columns are produced while the cascade is being built, and an interval
    // with no columns in it ages the watch exactly as an undrainable backlog
    // does. A slow coefficient fetch on a live microphone would otherwise put
    // the button up on the strength of the reload it caused.
    resetLagWatch();
    worker.postMessage({
        type: 'open',
        coeff: `cochlea_88200_erb${S.erb}.coch`,
        rate: ctx.sampleRate,
        columnMs: S.columnMs / closeUpK,
        deskew: S.deskew ? 1 : 0,
        // Carried in the message rather than in the worker's own URL, so the
        // worker script has nothing to parse and the factor survives every
        // reopen -- including the one a catch-up does, which is the case that
        // has to keep working for the test to mean anything.
        slow: SLOW_FACTOR,
    });
}

async function ensureAudio() {
    if (ctx) return;
    ctx = new AudioContext();
    await ctx.audioWorklet.addModule('./capture-worklet.js?v=DEV');
    // Explicitly mono, so a stereo file is mixed down by the browser rather
    // than having its right channel quietly dropped.
    capture = new AudioWorkletNode(ctx, 'capture', {
        numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1],
        channelCount: 1, channelCountMode: 'explicit',
        channelInterpretation: 'speakers',
    });
    capture.port.onmessage = ev => {
        blocksIn++;                    // counted even when dropped: this says
                                       // the microphone is alive, nothing more
        // A frozen picture is not fed.
        //
        // The columns made from this audio would be thrown away on arrival --
        // see the append below, which has always skipped them -- so running the
        // cascade over it was work whose only effect was to fill the queue. On
        // a machine with headroom that cost nothing visible. On one without,
        // pausing for ten seconds bought ten seconds of backlog and handed it
        // to you on resume: the picture came back further behind than it had
        // been when you stopped it, which is the opposite of what stopping
        // something is for.
        //
        // Nothing is lost that was not already being lost. Live input cannot be
        // paused, only ignored; the recorder is already stopped here for the
        // same reason (`capturing()` below), and the seam drawn on resume is
        // already the statement that this interval is in neither the picture
        // nor the recording. This makes the queue agree with them.
        //
        // `samplesSent` is not advanced either, or it would drift from the
        // worker's `consumed` by the whole pause and read as permanent backlog.
        //
        // Live input only. A file is paused by suspending the context, so
        // almost nothing arrives here on that path -- but `paused` is set
        // before `suspend()`, which is asynchronous, and the blocks already
        // posted by the worklet are still in this thread's queue behind the
        // press. Dropping those loses them from `samplesSent`, and
        // `samplesSent` is what the end of a file is counted in: the flush
        // below would then fire that many samples into the silence after the
        // file, or not at all before `onended` catches it. Which is exactly the
        // fault the sample counting exists to remove, reintroduced, and it
        // accumulates over every pause. There is nothing to gain there either:
        // a suspended context is already not feeding the engine.
        if (paused && !playingFile) return;
        // The raw input peak, taken here because the buffer is transferred on
        // the next line and is gone afterwards. This is the one number that
        // separates "the display is wrong" from "the signal is quiet", and
        // not having it has cost several rounds of reading pictures.
        const s = ev.data;
        for (let i = 0; i < s.length; ++i) {
            const a = s[i] < 0 ? -s[i] : s[i];
            if (a > inPeak) inPeak = a;
        }
        samplesSent += s.length;
        // Kept before the transfer, which takes the buffer away. Only while a
        // live picture is running: nothing is recorded once it is frozen, so
        // the recording skips exactly the interval the picture skips, and a
        // selection spanning a seam plays straight across it with no gap to
        // reason about. It also keeps the microphone from recording the
        // playback coming out of the speakers. See REPLAY-DESIGN.md.
        if (capturing()) recorder.take(s.slice());
        worker.postMessage({ type: 'audio', samples: ev.data },
                           [ev.data.buffer]);
        // Ask the engine to report as soon as it has consumed the last of the
        // file -- posted here, so it sits in the queue directly behind that
        // audio and ahead of whatever silence follows.
        if (fileEndsAt && samplesSent >= fileEndsAt) {
            fileEndsAt = 0;
            endToken++;
            worker.postMessage({ type: 'flush', token: endToken });
        }
    };
    // A worklet with nothing downstream may be pruned, so it feeds a silent
    // sink. Not the speakers: this is a microphone display, and routing the
    // microphone to the output is how you get feedback.
    const mute = ctx.createGain();
    mute.gain.value = 0;
    capture.connect(mute).connect(ctx.destination);

    // iOS suspends an AudioContext for reasons of its own -- another app taking
    // the audio session, a call, the page being backgrounded -- and it does not
    // resume by itself. Without this the display simply stops and stays
    // stopped, which is exactly what it did on an iPad.
    //
    // Except a suspension we asked for. Pausing a *file* is done by suspending
    // the context, which fires this -- so pause froze the picture, this handler
    // read it as an interruption and resumed, and the file played on inaudibly
    // past the point you were looking at. Resuming then landed somewhere later
    // with no seam to say so.
    ctx.onstatechange = () => {
        if (ctx.state !== 'running' && !paused) resumeAudio();
    };

    startWorker();
    openEngine();
    requestAnimationFrame(frame);
}

/// One button, and it shows what pressing it will do.
///
/// There is no separate way back to the microphone. Everything that button
/// would have done -- start listening if the browser refused on load, return
/// to live input after a file has run out -- is a case of "make the picture
/// move again", which is what this one already means. The Mac app's space bar
/// has always worked this way.
function showTransport() {
    const willStart = paused || fileEnded || !ctx || (!micSource && !fileSource);
    $('pause').textContent = willStart ? '\u25B6' : '\u2759\u2759';
    $('pause').title = fileEnded || (!micSource && !fileSource)
        ? (TEST_MODE ? 'Start the test signal' : 'Listen to the microphone')
        : (paused ? 'Resume' : 'Freeze the display');
    // Derived here rather than set at the moment a file starts, which is what
    // the Mac app does and for the same reason: set once, Replay stayed on
    // screen through the whole of the replay it was offering, and then stayed
    // there after the microphone had taken over.
    $('fname').hidden  = !lastBuffer;
    $('replay').hidden = !lastBuffer || !playedThrough;
    // In the same place as the rest of the transport, so there is one answer to
    // "which buttons are on screen" rather than two.
    showReplayControls();
}

/// A file that has run out has nothing to resume, so rather than have the
/// button do nothing it takes you back to live input. The picture is left
/// frozen at the end of the file on purpose -- that is when you want to
/// measure what you have just seen.
function togglePause() {
    if (!ctx || fileEnded || (!micSource && !fileSource)) {
        fileEnded = false;
        // A press of a real button is the most reliable user gesture there is,
        // so in test mode this is the way in most likely to work when starting
        // on load did not.
        if (TEST_MODE) startTestSignal(); else startMic();
        return;
    }
    setPaused(!paused);
}

function stopSources() {
    // RePlay belongs to whatever was on screen, which is about to be replaced.
    stopReplay();
    // Whatever was playing is not going to reach its end now, so the count
    // that was waiting for it must not fire against the next thing.
    fileEndsAt = 0;
    // Nor must a flush that has *already* been asked for. Clearing the count
    // stops a new one being sent; it does nothing about one in flight, and the
    // reply to that one used to arrive after the next file had started and
    // freeze it -- a picture stopped with `playedThrough` still false, which
    // also hides Replay, so the only way on was back to the microphone.
    // Reachable by pressing Replay in the moment between a file ending and the
    // engine reporting that it has caught up, which is a real interval and not
    // a short one at 0.5 ms per column.
    //
    // Moving the token here is what the comment on its declaration always
    // claimed: a file that has been interrupted can no longer end.
    endToken++;
    if (fileSource) { try { fileSource.stop(); } catch {} fileSource.disconnect(); fileSource = null; }
    if (micSource) { micSource.disconnect(); micSource = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    playingFile = false;
    // Whatever comes next is a different recording. Restarted rather than
    // carried over, because a new source can be at a different sample rate and
    // playing old audio back at a new one would pitch-shift it.
    recorder.reset(ctx ? ctx.sampleRate : 0);
    recordedPerColumn = 0;
    recordedLag = -1;
    // Every change of source funnels through here, and each one both stops the
    // columns for a while and makes the button inapplicable. Retracting it now
    // rather than at the next tick closes the second for which it would still
    // be on screen, and clickable, over a source that no longer exists.
    resetLagWatch();
}

// ---- sources -------------------------------------------------------------

async function startMic({ quiet = false } = {}) {
    await ensureAudio();
    // Before asking for the microphone, not after: stopSources() stops every
    // track it can see, and called afterwards it would have switched off the
    // stream that had just been granted.
    stopSources();
    const gen = ++startGen;
    try {
        // All three off. They are meant to make speech intelligible over a
        // call, and each is a filter, a gate or a compressor sitting between
        // the microphone and a display whose whole purpose is to show what the
        // signal actually is.
        micStream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, noiseSuppression: false,
                     autoGainControl: false },
        });
    } catch (e) {
        // On load this is not a failure worth shouting about: the visitor may
        // simply not have been asked yet, or may have said no and be about to
        // open a file instead.
        if (!quiet) say('no microphone: ' + e.message);
        showTransport();          // still offering to try again
        return false;
    }
    if (gen !== startGen) {       // something else started while we asked
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
        return false;
    }
    micSource = ctx.createMediaStreamSource(micStream);
    micSource.connect(capture);
    fileEnded = false;
    setPaused(false);
    await resumeAudio();
    return true;
}


/// Get the context running, and if the browser will not allow it yet, wait
/// for the first gesture and try again.
///
/// Autoplay policy: an AudioContext starts suspended and `resume()` is only
/// honoured once the page has been interacted with. Granting the microphone
/// counts on some browsers and not on others, so this asks, checks, and if the
/// answer is no, arms a one-shot listener rather than leaving a page that
/// looks alive and is silent.
/// Which events count as "the visitor did something". `touchend` is in the
/// list because some iOS versions unlock audio on that and not on the
/// `pointerdown` that precedes it.
const kGestures = ['pointerdown', 'touchend', 'click', 'keydown'];

async function resumeAudio() {
    if (!ctx) return false;
    try { await ctx.resume(); } catch {}
    if (ctx.state === 'running') {
        // A suspension stops the blocks and therefore stops the columns, and
        // the watch cannot tell an interval with no columns in it from a
        // backlog that will not drain -- both leave `lastCaughtUp` where it
        // was. Without this, a context suspended for two minutes by iOS taking
        // the audio session comes back and puts the button up on its next tick,
        // reading whatever the lag was before the suspension, which is usually
        // "0.0 s behind". A red fault button showing zero is worse than either
        // being right or saying nothing.
        resetLagWatch();
        return true;
    }
    say('click anywhere to start');
    // Not `async`: everything up to the first `await` runs inside the gesture,
    // and on iOS that is the whole of the permission to start audio. An
    // `await` before touching the context spends it.
    const go = () => {
        for (const ev of kGestures) document.removeEventListener(ev, go);
        // iOS wants to see the context *used* during the gesture, not merely
        // resumed after one. A one-sample silent buffer, started here and
        // synchronously, is what actually unlocks it -- and until now the app
        // never needed it, because `getUserMedia` unlocks audio as a side
        // effect and every path that reached here had already called it. The
        // test signal is the first path that does not.
        try {
            const b = ctx.createBuffer(1, 1, 22050);
            const q = ctx.createBufferSource();
            q.buffer = b; q.connect(ctx.destination); q.start(0);
        } catch {}
        ctx.resume().then(() => {
            if (ctx.state === 'running') {
                say(`live · ${Math.round(ctx.sampleRate)} Hz`);
            } else {
                // Refused again. Arm for the next gesture rather than giving
                // up: on iOS the first tap after an interruption is often
                // ignored.
                resumeAudio();
            }
        }).catch(() => resumeAudio());
    };
    for (const ev of kGestures) document.addEventListener(ev, go);
    return false;
}

$('open').onclick = () => $('file').click();
$('file').onchange = e => { if (e.target.files[0]) playFile(e.target.files[0]); };

async function playFile(file) {
    await ensureAudio();
    stopSources();
    // Before the decode, not after. The permission to start audio comes from
    // the gesture that opened the picker, and a large file can take longer to
    // decode than that permission lasts.
    await resumeAudio();
    let buf;
    try {
        buf = await ctx.decodeAudioData(await file.arrayBuffer());
    } catch (e) {
        say(`cannot decode ${file.name}`);
        showTransport();          // nothing is running; say so on the button
        return;
    }
    lastBuffer = buf;
    lastName = file.name;
    $('fname').textContent = file.name;
    $('fname').title = `${file.name} · ${buf.duration.toFixed(1)} s`;
    // Passed, not read back out of `lastBuffer`: two decodes in flight would
    // otherwise have the first to finish play the second one's audio.
    await playBuffer(buf, file.name);
}

/// Play the file again. Replay does exactly this and nothing else.
const playLastFile = () => playBuffer(lastBuffer, lastName);

async function playBuffer(buf, name) {
    if (!buf) return;
    await ensureAudio();
    stopSources();
    const gen = ++startGen;
    await resumeAudio();
    if (gen !== startGen) return;             // overtaken while the clock woke
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(capture);
    src.connect(ctx.destination);             // and you hear it
    src.onended = () => {
        // `src === fileSource`, not merely `playingFile`. Stopping a source
        // fires this too, and it arrives a task later -- by which time a
        // replay has already started the next one, which would then be marked
        // as having ended the moment it began.
        if (fileSource !== src || !playingFile) return;
        playingFile = false;
        playedThrough = true;
        // Neither the mark nor the freeze happens here. This fires when the
        // last sample has been *played*, and the columns for it are still
        // travelling from the worklet through the worker -- so marking now
        // lands the line short of the true end, and freezing now leaves those
        // columns undrawn. Ask the engine to tell us when it has caught up.
        // Normally the sample count has already asked for the flush, and this
        // is only the backstop -- for a source stopped before its end, where
        // no such count was ever reached.
        if (fileEndsAt || !worker) {
            fileEndsAt = 0;
            endToken++;
            if (worker) worker.postMessage({ type: 'flush', token: endToken });
            else finishFile();
        }
    };
    fileSource = src;
    // Where this file stops, in samples through the analyser. The buffer is
    // already at the context's rate, so its length is the count.
    fileEndsAt = samplesSent + buf.length;
    playingFile = true;
    fileEnded = false;
    playedThrough = false;
    // The start of a file is a jump in time just as much as its end: whatever
    // was on the picture a moment ago -- the room, or the same file's last
    // second -- was never adjacent to this. Replay makes that easy to reach.
    display.mark('seam');
    setPaused(false);
    src.start();
    say(`${name} · ${buf.duration.toFixed(1)} s`);
}

$('replay').onclick = () => playLastFile();

/// A signal the app makes for itself, so the microphone can be taken out of
/// the question without a file having to be got onto the device.
///
/// Broadband noise whose level sweeps the full width of the display window --
/// -20 dBFS down to -110 and back over eight seconds -- with a click on each
/// second. Drawn correctly that is a smooth grey wash, dark at the top of the
/// sweep and pale at the bottom, crossed by vertical lines. Anything that
/// gates, thresholds or quantises the signal on its way in cannot produce a
/// wash: it produces bands with nothing between them, and the difference is
/// not a judgement call.
function testSignalBuffer() {
    const secs = 8, sr = ctx.sampleRate;
    const buf = ctx.createBuffer(1, Math.round(secs * sr), sr);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; ++i) {
        const db = -65 + 45 * Math.cos(2 * Math.PI * (i / sr) / secs);
        d[i] = (Math.random() * 2 - 1) * Math.pow(10, db / 20);
    }
    for (let k = 0; k < secs; ++k) d[Math.round(k * sr)] += 0.5;
    return buf;
}

async function startTestSignal() {
    await ensureAudio();
    stopSources();
    await resumeAudio();
    fileSource = ctx.createBufferSource();
    fileSource.buffer = testSignalBuffer();
    fileSource.loop = true;
    // To the analyser only. It is a test, not a sound, and at the top of the
    // sweep it is loud.
    fileSource.connect(capture);
    playingFile = true;
    fileEnded = false;
    setPaused(false);
    fileSource.start();
    say('test signal, no microphone \u00b7 noise sweeping \u221220 to \u2212110 dBFS');
}

// Dropping a file on the picture is the obvious gesture and costs three lines.
view.addEventListener('dragover', e => { e.preventDefault(); view.classList.add('drop'); });
view.addEventListener('dragleave', () => view.classList.remove('drop'));
view.addEventListener('drop', e => {
    e.preventDefault(); view.classList.remove('drop');
    if (e.dataTransfer.files[0]) playFile(e.dataTransfer.files[0]);
});

// ---- transport -----------------------------------------------------------

function setPaused(on, mark = true) {
    // Before `paused` moves, not after. Resuming starts the picture moving
    // again and starts recording over what is being played, so it is the one
    // control that must interrupt -- and it has to interrupt while `capturing`
    // still answers false, or the tail draining out of the speakers would be
    // recorded as though it were the room.
    if (!on) {
        stopReplay();
        // A new stretch: the interval about to be skipped is in neither the
        // picture nor the recording, so the old terms will not describe what
        // arrives next.
        recordedPerColumn = 0;
        // The queue was drained by the pause -- nothing was fed to the engine
        // while the picture was frozen -- so there is genuinely no backlog to
        // resume with, and the watch has to be told. Without this the button
        // flashes red on every resume from a pause longer than
        // `LAG_PERSIST_MS`, on every device: `lastCaughtUp` only moves when a
        // measurement arrives, no measurements arrive once the queue is empty,
        // so the age of the watch is the length of the pause. It reads
        // "0.0 s behind", because that is what the last real measurement said,
        // and it clears itself a tenth of a second later. A red fault button
        // showing zero is the thing `resumeAudio` already refuses to do.
        resetLagWatch();
        // Stale otherwise, and now permanently so: nothing updates it while
        // frozen and nothing reads or clears it either, so the first second
        // after a resume would report the peak from just before the pause --
        // "in -6 dBFS" over a silent room, ten minutes later.
        inPeak = 0;
    }
    paused = on;
    // A measurement is anchored to a column of a frozen picture. Once the
    // picture starts moving again the two lines are over whatever has scrolled
    // into their place, which is not what was measured.
    display.paused = on;
    if (!on) display.clearMeasurement();
    if (playingFile) {
        // A file is genuinely paused: nothing is produced and nothing is lost,
        // so there is no seam to mark and drawing one would be a lie in the
        // other direction.
        on ? ctx.suspend() : ctx.resume();
    } else if (on && mark) {
        display.mark('seam');
    }
    showTransport();
    // Freezing makes the button inapplicable, and that belongs to the press
    // rather than to the next tick a tenth of a second later. Resuming cannot
    // put it back up -- `resetLagWatch` above has just cleared the watch -- but
    // this is also the call that hides it on the way in.
    updateCatchUp();
}
$('pause').onclick = togglePause;
window.addEventListener('keydown', e => {
    // Escape dismisses a measurement, and only that: swallowing it when there
    // is nothing to dismiss would stop it doing whatever else it does.
    if (e.code === 'Escape' && display.hasMeasurement) {
        display.clearMeasurement();
        return;
    }
    if (e.code === 'Space') {
        // Space is the transport, wherever the focus happens to be.
        //
        // Clicking a checkbox leaves it focused, and the browser's own meaning
        // for space on a focused checkbox is "toggle me" -- so after touching
        // any control, space stopped pausing and started flipping whatever was
        // clicked last. preventDefault is what stops that: the toggle is a
        // default action, and refusing it here happens before the control ever
        // sees the key.
        //
        // The exception is somewhere you might be typing, where a space is a
        // space. There is nowhere in this page today, but there will be.
        const t = e.target;
        if (t && (t.isContentEditable ||
                  (t.tagName === 'INPUT' &&
                   ['text', 'search', 'number', 'email', 'url'].includes(t.type)))) {
            return;
        }
        e.preventDefault();
        togglePause();
    }
});

// Let go of a control once it has been clicked.
//
// Not only so space keeps working -- preventDefault already sees to that --
// but because a control that stays visibly selected after you have finished
// with it looks like it is still waiting for something.
//
// Only on a real click: `detail` is zero when a click was synthesised from the
// keyboard, and someone navigating by Tab should keep the focus they are
// using. Selects are let go on change instead, since blurring one mid-click
// would shut the menu the click had just opened.
for (const el of document.querySelectorAll('#bars button, #bars input')) {
    el.addEventListener('click', e => { if (e.detail > 0) el.blur(); });
}
for (const el of document.querySelectorAll('#bars select')) {
    el.addEventListener('change', () => el.blur());
}

// ---- controls ------------------------------------------------------------

$('speed').onchange = e => {
    S.columnMs = +e.target.value; save();
    // Everything left of the mark was drawn at a different number of
    // milliseconds per column, so widths either side are not comparable.
    display.mark('scaleChange');
    // The divisor is derived from the main column time, so changing Speed
    // changes the engine's rate as well when the close-up is open.
    applyCloseUp();
};
$('erb').onchange = e => {
    S.erb = e.target.value; save();
    // A different tuning is a different coefficient file, so the engine is
    // reopened; the filters either side of the mark have different bandwidths.
    display.mark('tuningChange');
    if (worker) openEngine();
};
$('deskew').onchange = e => {
    S.deskew = e.target.checked; save();
    // A seam, in the same red as every other break in time -- because that is
    // what this is. De-skew holds each tap back by its own travelling-wave
    // delay, up to about 170 ms at the apex, so switching it slides the low
    // rows against the high ones and the columns either side of the change
    // were never adjacent. Without the line the picture would claim a
    // continuity across the join that it does not have.
    display.mark('seam');
    worker?.postMessage({ type: 'deskew', value: S.deskew ? 1 : 0 });
    applyCloseUp();                     // the two cannot both be on
};
$('invert').onchange = e => {
    S.invert = e.target.checked; save();
    display.exposure.inverted = S.invert;
    display.remapAll();
};
// Neither is marked. A mark says the picture stops meaning what it meant, and
// nothing about the sound or its timing changes here -- the strip takes no
// columns from the picture at all, and the spectrum takes the oldest of them
